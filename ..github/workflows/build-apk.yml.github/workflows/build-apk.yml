name: Build Detecteur Spam APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Preparer le fichier principal
  run: |
    PYFILE=$(find . -maxdepth 1 -type f -name "*.py" | head -n 1)
    echo "Fichier Python trouve : $PYFILE"
    cp "$PYFILE" main.py

      - name: Installer les dependances systeme
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            automake \
            libltdl-dev

      - name: Installer Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cython<3.4" buildozer

      - name: Construire APK
        run: |
          buildozer -v android debug

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: Detecteur-Spam-APK
          path: bin/*.apk
