name: Build Detecteur Spam APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v7

      - name: Installer Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Verifier les fichiers Python
        run: |
          echo "Fichiers Python trouves :"
          git ls-files '*.py'

      - name: Trouver l'application Kivy
        shell: bash
        run: |
          PYFILE=""

          while IFS= read -r file; do
            if grep -qE '(^|[[:space:]])(from|import)[[:space:]]+kivy' "$file"; then
              PYFILE="$file"
              break
            fi
          done < <(git ls-files '*.py')

          if [ -z "$PYFILE" ]; then
            echo "ERREUR : aucune application Kivy n'a ete trouvee."
            echo "Voici les fichiers Python disponibles :"
            git ls-files '*.py'
            exit 1
          fi

          echo "Application trouvee : $PYFILE"
          cp "$PYFILE" main.py

          echo "Verification de main.py :"
          ls -lh main.py

      - name: Verifier buildozer.spec
        run: |
          test -f buildozer.spec
          echo "buildozer.spec trouve."
          sed -n '1,120p' buildozer.spec

      - name: Installer les dependances systeme
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            automake \
            libltdl-dev

      - name: Installer Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cython<3.4" buildozer

      - name: Construire l'APK
        run: |
          buildozer -v android debug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Detecteur-Spam-APK
          path: bin/*.apk
          if-no-files-found: error
