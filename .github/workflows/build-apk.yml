name: Build Detecteur Spam APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer Java
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Installer dependances Linux
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            automake libltdl-dev

      - name: Trouver le fichier Python
        shell: bash
        run: |
          echo "Fichiers Python du depot :"
          git ls-files '*.py'

          PYFILE=$(git ls-files '*.py' | head -n 1)

          if [ -z "$PYFILE" ]; then
            echo "ERREUR : aucun fichier Python trouve."
            exit 1
          fi

          echo "Fichier utilise : $PYFILE"
          cp "$PYFILE" main.py

          echo "main.py cree :"
          ls -lh main.py

      - name: Installer Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install git+https://github.com/kivy/buildozer
          python -m pip install legacy-cgi setuptools cython==0.29.34

      - name: Nettoyer les anciens fichiers Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Construire l APK
        run: |
          buildozer android debug

      - name: Recuperer l APK
        uses: actions/upload-artifact@v4
        with:
          name: Detecteur-Spam-APK
          path: bin/*.apk
          if-no-files-found: error
